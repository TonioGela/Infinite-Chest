[config]
schemaVersion = "0.0.1"

[package]
namespace = "BrugherheimFolks"
name = "Infinite_Chest"
description = "A wood chest that, once you put an item in, stays full of that item forever. Multiplayer compatible."
websiteUrl = "https://github.com/TonioGela/Infinite-Chest"
containsNsfwContent = false

[package.dependencies]
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build/thunderstore"

# package.sh puts the built DLL here
[[build.copy]]
source = "./build/plugin"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "server-side"]
